name: Backend tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 full suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend application
        run: python -m compileall -q backend/app

      - name: Run complete backend regression suite
        run: python -m pytest

      - name: Run Step 217 controlled Reality State quality baseline
        run: python -m backend.app.evaluation.reality_state_quality_benchmark --summary-only

      - name: Run Step 218 official-publisher-anchored quality replay
        run: python -m backend.app.evaluation.official_source_quality_benchmark --summary-only

      - name: Run Step 220 opt-in independent source text assurance replay
        run: python -m backend.app.evaluation.independent_source_assurance_benchmark
    
      - name: Run Step 223 server-observed freshness spoof replay
        run: python -m backend.app.evaluation.capture_freshness_benchmark

      - name: Run Step 224 synthetic hidden-HTML evidence visibility benchmark
        run: python -m backend.app.evaluation.html_visibility_quality_benchmark

      - name: Run Step 225 source structural quote boundary replay
        run: python -m backend.app.evaluation.structural_quote_benchmark

      - name: Run Step 227 conservative atomic claim alignment policy replay
        run: python -m backend.app.evaluation.claim_alignment_benchmark

      - name: Run Step 228 independently observed source-unit integrity replay
        run: python -m backend.app.evaluation.observed_context_benchmark
