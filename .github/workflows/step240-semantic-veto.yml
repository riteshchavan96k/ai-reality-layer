name: Step 240 real authenticated source-bound NLI veto integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step240-source-bound-neural-veto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-source-authenticated-neural-veto:
    name: Genuine Python.org source to authenticated API, pinned ONNX veto-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v7
      - name: Python 3.13 CPU runner
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-nli-shadow.txt
      - name: Install opt-in model dependencies separate from production
        run: python -m pip install -r backend/requirements-nli-shadow.txt
      - name: Verify source handoff adversarial API and neural no-promotion tests
        run: python -m pytest -q backend/tests/test_step240.py
      - name: Execute actual original-source FastAPI to genuine neural model veto
        run: python -m backend.app.evaluation.step240_live_semantic_veto --live
