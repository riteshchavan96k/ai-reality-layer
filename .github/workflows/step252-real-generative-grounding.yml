name: Step 252 real generative LLM candidate with original-source gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-llm-source:
    name: Actual FLAN-T5 CPU and original Python.org HTTPS verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.11 for pinned optional torch model
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies and verify offline adversarial tests
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pytest -q backend/tests/test_step252.py
      - name: Install pinned CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned optional generative model dependencies
        run: python -m pip install transformers==4.52.4 huggingface-hub==0.32.4 safetensors==0.5.3 sentencepiece==0.2.0
      - name: Real SHA-verified FLAN-T5 generation with independently observed original-source evidence
        run: python -m backend.app.evaluation.step252_live_llm_question --live
