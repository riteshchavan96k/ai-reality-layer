name: Step 247 durable cross-session original-source recheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persisted-source-history:
    name: Real Python.org HTTPS across two separate authenticated CLI processes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact Git commit
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install current backend dev requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run Step 247 adversarial persistence cases
        run: python -m pytest -q backend/tests/test_step247.py
      - name: Check real HTTPS capture then persistent cross-process recheck
        run: python -m backend.app.evaluation.step247_live_history --live
