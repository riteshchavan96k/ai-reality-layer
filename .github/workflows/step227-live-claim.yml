name: Step 227 live original-source claim alignment canary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step227-live-claim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claim-live:
    name: Approved Python.org real HTTPS bounded claim alignment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      ARL_INDEPENDENT_SOURCE_ALLOWED_URLS: '["https://www.python.org/downloads/release/python-3130/"]'

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
      - name: Install Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Real HTTPS assertion positive and negated claim rejection
        run: python -m backend.app.evaluation.step227_live_smoke --live --output "$RUNNER_TEMP/step227-live-claim-audit.json"
      - name: Upload digest-only verified claim audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: step227-live-claim-audit
          path: ${{ runner.temp }}/step227-live-claim-audit.json
          if-no-files-found: error
          retention-days: 30
