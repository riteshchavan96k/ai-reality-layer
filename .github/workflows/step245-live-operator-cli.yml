name: Step 245 real original-source operator CLI end-to-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step245-local-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-cli:
    name: Authentic fixed publisher HTTPS to bounded operator command
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install unchanged backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Operator CLI adversarial and authenticated API tests
        run: python -m pytest -q backend/tests/test_step245.py
      - name: Genuine Python.org original HTTPS to local CLI with approved source
        run: python -m backend.app.evaluation.step245_live_cli --live
