name: Step 236 semantic evaluation foundation and blind review integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step236-semantic-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-foundation:
    name: Python 3.13 frozen unreviewed corpus and actual grammar policy baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@v7
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify blind review and tamper rejection tests
        run: python -m pytest -q backend/tests/test_step236.py
      - name: Reproduce actual deterministic text-only semantic baseline
        run: python -m backend.app.evaluation.step236_semantic_baseline --summary-only
