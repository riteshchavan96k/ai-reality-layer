name: Launch production dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Fresh advisories can appear after successful builds.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  production-dependency-audit:
    name: Production runtime PyPI advisory audit and licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Reject unpinned or unintended production dependencies
        run: python scripts/launch_production_dependency_guard.py
      - name: Install production-only dependency closure in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/arl-production-audit"
          "$RUNNER_TEMP/arl-production-audit/bin/python" -m pip install --no-cache-dir -r backend/requirements.txt
          "$RUNNER_TEMP/arl-production-audit/bin/python" -m pip check
      - name: Print bounded distribution licence metadata for owner review
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/arl-production-audit/bin/python" scripts/launch_production_dependency_guard.py --runtime-license-metadata
      - name: Install pinned independent security auditor
        run: python -m pip install --no-cache-dir pip-audit==2.10.1
      - name: Audit exact installed runtime packages for known advisories
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/arl-production-audit/bin/python" -m pip freeze > "$RUNNER_TEMP/arl-production-freeze.txt"
          test -s "$RUNNER_TEMP/arl-production-freeze.txt"
          python -m pip_audit --strict --no-deps --disable-pip \
            --progress-spinner off --vulnerability-service pypi \
            -r "$RUNNER_TEMP/arl-production-freeze.txt"
