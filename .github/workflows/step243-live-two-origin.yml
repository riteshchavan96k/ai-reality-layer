name: Step 243 genuine two-host bounded cited-answer comparison

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-origin-source-comparison:
    name: Defensive two-host API plus real Python.org and IANA HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run authenticated comparison API adversarial suite
        run: python -m pytest -q backend/tests/test_step243.py
      - name: Prove genuine HTTPS two-host conservative abstention
        run: python -m backend.app.evaluation.step243_live_two_origin --live
